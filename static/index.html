<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NovaBrain Sentinel</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0f14'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%2376b900'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0b0f14;
    --panel: #131a23;
    --line: #232f3d;
    --text: #e6edf3;
    --muted: #9db0c2;
    --accent: #76b900;
    --ok: #3fb950;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 2rem 1.25rem;
    background: var(--bg);
    color: var(--text);
    font: 400 16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  main { width: 100%; max-width: 50rem; }
  .eyebrow {
    color: var(--accent);
    font: 600 0.75rem/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin: 0 0 0.75rem;
  }
  h1 { font-size: clamp(1.9rem, 5vw, 2.75rem); margin: 0 0 0.5rem; letter-spacing: -0.02em; }
  .tagline { color: var(--muted); margin: 0 0 2rem; max-width: 34rem; }
  .loop {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 1.25rem;
    margin: 0 0 1.5rem;
  }
  .loop h2 {
    font: 600 0.7rem/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 1rem;
  }
  /* One unbroken chain; scrolls instead of wrapping so no arrow dangles at a line end. */
  .stages { display: flex; flex-wrap: nowrap; align-items: center; gap: 0.5rem; margin: 0; padding: 0 0 0.25rem; list-style: none; overflow-x: auto; }
  .stages li { display: flex; align-items: center; gap: 0.5rem; }
  .chip {
    font: 500 0.82rem/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--text);
    background: #1b2531;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 0.5rem 0.65rem;
    white-space: nowrap;
  }
  .sep { color: var(--accent); }
  .status {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    border-top: 1px solid var(--line);
    padding-top: 1.25rem;
    font: 500 0.95rem/1 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px rgba(63,185,80,0.18); flex: none; }
  .label { color: var(--muted); }
  .value { color: var(--ok); }
  footer { color: var(--muted); font-size: 0.8rem; margin-top: 2rem; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <p class="eyebrow">NVIDIA Build Challenge</p>
  <h1>NovaBrain Sentinel</h1>
  <p class="tagline">Persistent operational AI agent. Early hackathon build &mdash; deployable vertical slice.</p>

  <section class="loop">
    <h2>Cognitive loop</h2>
    <ul class="stages">
      <li><span class="chip">OBSERVE</span><span class="sep" aria-hidden="true">&rarr;</span></li>
      <li><span class="chip">UNDERSTAND</span><span class="sep" aria-hidden="true">&rarr;</span></li>
      <li><span class="chip">DECIDE</span><span class="sep" aria-hidden="true">&rarr;</span></li>
      <li><span class="chip">ACT / REQUEST APPROVAL</span><span class="sep" aria-hidden="true">&rarr;</span></li>
      <li><span class="chip">VERIFY</span><span class="sep" aria-hidden="true">&rarr;</span></li>
      <li><span class="chip">LEARN</span></li>
    </ul>
  </section>

  <p class="status">
    <span class="dot" aria-hidden="true"></span>
    <span class="label">System Status:</span>
    <span class="value">Operational</span>
  </p>

  <footer>
    <a href="/health">/health</a>
  </footer>
</main>
</body>
</html>
